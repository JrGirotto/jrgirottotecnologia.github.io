name: Deploy to GitHub Pages
on:
  push:
    branches: [ new_site ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Download LFS assets
        run: git lfs pull

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm'  # ❌ REMOVIDO (exigia lockfile)

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build  # Next 14 com output:'export' gera ./out

      - name: Ensure 404 & CNAME
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp public/CNAME out/CNAME 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
